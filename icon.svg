<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Card Container -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Chinese Character 汉 (Hàn) -->
  <text x="256" y="325" font-family="'Ma Shan Zheng', 'Zhi Mang Xing', 'STKaiti', 'KaiTi', 'SimHei', sans-serif" font-size="240" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">汉</text>
  
  <!-- Accent Badge 'HSK' -->
  <g transform="translate(196, 385)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#10b981" filter="url(#shadow)" />
    <text x="60" y="27" font-family="'Kanit', 'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">HSK</text>
  </g>
</svg>
